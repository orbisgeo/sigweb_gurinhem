<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Gurinhém</title>

    <link rel="stylesheet" href="https://openlayers.org/en/v6.15.1/css/ol.css" type="text/css">
    <script src="https://openlayers.org/en/v6.15.1/build/ol.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsts/2.6.1/jsts.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" type="text/css">

    <style>
        /* Estilos CSS essenciais para o funcionamento, adicione aqui se não tiver o style.css */
        #map {
            width: 100%;
            height: 100%;
        }
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 280px; /* Aumentado para melhor visualização */
            max-width: 350px; /* Adicionado limite */
            font-family: 'Poppins', sans-serif;
        }
        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 2px;
            right: 8px;
            color: #333;
            font-size: 1.2em;
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .popup-title {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        /* ======================================================== */
        /* NOVOS ESTILOS PARA O FORMULÁRIO DE INFORMAÇÕES (POPUP) */
        /* ======================================================== */
        #popup-content {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px; /* Espaço para a barra de rolagem */
        }
        .popup-info-grid {
            display: grid;
            grid-template-columns: auto 1fr; /* Coluna 1 (auto) para labels, Coluna 2 (1fr) para valores */
            gap: 8px 10px;
            font-size: 0.9em;
        }
        .info-key {
            font-weight: 500;
            color: #555;
            text-align: right;
            word-break: break-word;
        }
        .info-value {
            font-weight: 400;
            color: #111;
            word-break: break-word; /* Quebra palavras longas */
        }
        /* ======================================================== */


        .ol-tooltip {
            position: relative;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            opacity: 0.8;
            white-space: nowrap;
            font-size: 12px;
            cursor: default;
        }
        .ol-tooltip-measure {
            opacity: 1;
            font-weight: bold;
        }
        #printModeControls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none; /* Inicia escondido */
        }
        #northArrowPrint {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            z-index: 10;
            display: none; /* Inicia escondido */
        }
        .print-mode-active #sidebar, .print-mode-active .ol-control, .print-mode-active #printModeControls {
            display: none !important;
        }
        .sugestao-item {
            padding: 8px 10px; /* Mais espaçamento */
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        .sugestao-item:last-child {
            border-bottom: none;
        }
        .sugestao-item:hover {
            background-color: #f0f0f0;
        }
        #sugestoes {
            border: 1px solid #ccc;
            background-color: white;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            width: calc(100% - 2px); /* Ajustado para bater com o input */
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Sombra suave */
        }

        /* Estilos para o novo botão de Zoom na Camada */
        .layer-control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .layer-control-item label {
            flex-grow: 1;
        }
        .layer-control-item .zoom-btn {
            background: none;
            border: none;
            color: #333;
            font-size: 1em;
            cursor: pointer;
            padding: 0 5px;
            margin-left: 10px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .layer-control-item .zoom-btn:hover {
            opacity: 1;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <aside id="sidebar">
            <div id="tools-panel" class="panel">
                <h2 class="panel-header">Ferramentas</h2>
                <div class="tool-buttons">
                    <button class="btn" onclick="toggleMeasureDistance()">📏 Medir Distância</button>
                    <button class="btn" onclick="toggleMeasureArea()">📐 Medir Área</button>
                    <button class="btn" onclick="clearMeasurements()">❌ Limpar Medidas</button>
                    <button class="btn" onclick="mostrarOpcoesExportacao()">💾 Exportar KML</button>
                    <button class="btn" onclick="activatePrintMode()">🖨️ Modo Impressão</button>
                </div>
            </div>

            <div id="search-panel" class="panel">
                <h2 class="panel-header">Buscar Feição</h2>
                <div class="form-group">
                    <label for="camadaSelect">Selecione a Camada:</label>
                    <select id="camadaSelect"></select>
                </div>
                <div class="form-group">
                    <label for="campoSelect">Selecione o Campo:</label>
                    <select id="campoSelect"></select>
                </div>
                <div class="form-group" style="position: relative;"> <label for="valorBusca">Digite o Valor:</label>
                    <input type="text" id="valorBusca" placeholder="Digite para buscar..." autocomplete="off">
                    <div id="sugestoes" style="display: none;"></div>
                </div>
                <div id="search-buttons">
                    <button class="btn btn-primary" onclick="buscarFeicao()">🔍 Buscar</button>
                    <button class="btn" onclick="clearSearchHighlight()">Limpar Busca</button>
                </div>
            </div>
            
            <div id="customLayerControl" class="panel">
                <h2 class="panel-header">Gerenciar Camadas</h2>
                <div id="customLayerContent">
                    </div>
            </div>
        </aside>

        <main id="map-container">
            <div id="map"></div>
            
            <div id="printModeControls">
                    <button class="btn" onclick="triggerPrint()">Imprimir Mapa</button>
                    <button class="btn" onclick="deactivatePrintMode()">Sair do Modo Impressão</button>
            </div>
            <img id="northArrowPrint" src="https://www.flaticon.com/svg/v2/svg/664/664876.svg" alt="Seta Norte">

        </main>
    </div>

    <div id="map-popup" class="ol-popup">
        <div class="popup-header">
            <span id="popup-title" class="popup-title">Informações</span>
            <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
        </div>
        <div id="popup-content"></div>
    </div>


    <script>
        // Inicialização do Overlay do Popup para OpenLayers
        const container = document.getElementById('map-popup');
        const content = document.getElementById('popup-content');
        const closer = document.getElementById('popup-closer');

        const overlay = new ol.Overlay({
            element: container,
            autoPan: {
                animation: {
                    duration: 250,
                },
            },
        });

        closer.onclick = function () {
            overlay.setPosition(undefined);
            closer.blur();
            return false;
        };
    </script>
    
    <script>
        /* ================= Firebase ================= */
        // ATENÇÃO: Substitua "AIzaSyDxxxxxxx" pela sua CHAVE REAL DA API DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDxxxxxxx", 
            authDomain: "ruas-gurinhem.firebaseapp.com",
            projectId: "ruas-gurinhem"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ====================================================================
        // Habilitar Persistência Offline do Firestore.
        // ====================================================================
        db.enablePersistence()
            .then(() => {
                console.log("Persistência Offline do Firestore habilitada com sucesso!");
                initializeMapAndLayers();
            })
            .catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.warn("Múltiplas abas abertas, persistência offline não pode ser habilitada. Funcionará online.");
                } else if (err.code === 'unimplemented') {
                    console.warn("O navegador atual não suporta todos os recursos para persistência offline.");
                } else {
                    console.error("Erro ao habilitar persistência offline:", err);
                }
                initializeMapAndLayers();
            });

        // ====================================================================
        // EXPOSIÇÃO DE FUNÇÕES GLOBAIS PARA O HTML
        // ====================================================================
        let mapFunctions = {};

        window.toggleMeasureDistance = () => mapFunctions.toggleMeasureDistance();
        window.toggleMeasureArea = () => mapFunctions.toggleMeasureArea();
        window.clearMeasurements = () => mapFunctions.clearMeasurements();
        window.activatePrintMode = () => mapFunctions.activatePrintMode();
        window.triggerPrint = () => mapFunctions.triggerPrint();
        window.deactivatePrintMode = () => mapFunctions.deactivatePrintMode();
        window.mostrarOpcoesExportacao = () => mapFunctions.mostrarOpcoesExportacao();
        window.buscarFeicao = () => mapFunctions.buscarFeicao();
        window.clearSearchHighlight = () => mapFunctions.clearSearchHighlight();
        window.zoomToLayer = (key) => mapFunctions.zoomToLayer(key);

        // Função principal para inicializar o mapa e carregar as camadas
        function initializeMapAndLayers() {
            /* ================= Variáveis e Configurações Globais do Mapa ================= */
            const osmLayer = new ol.layer.Tile({
                title: "🗺️ OpenStreetMap",
                type: 'base',
                source: new ol.source.OSM(),
                visible: true
            });

            const sateliteLayer = new ol.layer.Tile({
                title: "🛰️ Satélite MapTiler",
                type: 'base',
                source: new ol.source.XYZ({
                    url: 'https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key=o9sqJVKN8wxu8WXujuRl',
                    tileSize: 512,
                }),
                visible: false
            });

            const emptyLayer = new ol.layer.Tile({
                title: "🚫 Sem Base",
                type: 'base',
                source: new ol.source.TileDebug({
                    projection: 'EPSG:3857',
                }),
                visible: false
            });

            proj4.defs("EPSG:31985", "+proj=utm +zone=25 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
            ol.proj.proj4.register(proj4);

            const extentDroneImage = [231844.66068941046, 9210570.410580005, 232802.90551243777, 9211417.585585851];
            const urlDroneImage = 'https://github.com/orbisgeo/DRONE-MAP/blob/main/rib_transparente.png?raw=true';

            const droneImageLayer = new ol.layer.Image({
                title: "📸 Imagem de Drone",
                type: 'overlay',
                source: new ol.source.ImageStatic({
                    url: urlDroneImage,
                    projection: 'EPSG:31985',
                    imageExtent: extentDroneImage,
                }),
                opacity: 1.0,
                visible: true
            });

            const scaleLineControl = new ol.control.ScaleLine({
                units: 'metric',
                bar: true,
                steps: 4,
                text: true,
                minWidth: 140
            });

            const map = new ol.Map({
                target: 'map',
                layers: [osmLayer, sateliteLayer, emptyLayer, droneImageLayer],
                view: new ol.View({
                    center: ol.proj.fromLonLat([-35.42, -7.12]),
                    zoom: 16,
                    maxZoom: 28,
                    minZoom: 1,
                    projection: 'EPSG:3857'
                }),
                controls: ol.control.defaults().extend([
                    scaleLineControl,
                    new ol.control.ZoomSlider()
                ])
            });

            // Adiciona o overlay do popup ao mapa AQUI
            if (typeof overlay !== 'undefined') { 
                map.addOverlay(overlay);
            } else {
                console.error("Variável 'overlay' não encontrada. Verifique se o script do HTML foi carregado corretamente.");
            }


            const transformedExtentDrone = ol.proj.transformExtent(extentDroneImage, 'EPSG:31985', 'EPSG:3857');
            map.getView().fit(transformedExtentDrone, {
                size: map.getSize(),
                padding: [50, 50, 50, 50],
                duration: 1500
            });

            // ====================================================================
            // Referências aos elementos da UI
            // ====================================================================
            const toolsPanel = document.getElementById('tools-panel');
            const searchPanel = document.getElementById('search-panel');
            const layerControlPanel = document.getElementById('customLayerControl');
            const layerContentContainer = document.getElementById('customLayerContent');

            const printModeControls = document.getElementById('printModeControls');
            const northArrowPrint = document.getElementById('northArrowPrint');

            // Popula o controle de camadas customizado para camadas BASE (rádio buttons) e Imagem de Drone
            map.getLayers().forEach(layer => {
                const title = layer.get('title');
                if (!title) return; 

                const containerDiv = document.createElement('div');
                containerDiv.className = 'layer-control-item';
                
                const label = document.createElement('label');
                const input = document.createElement('input');
                
                // Camadas Base e Imagem de Drone
                if (layer.get('type') === 'base') {
                    input.type = 'radio';
                    input.name = 'baseLayer';
                    input.value = title;
                    input.checked = layer.getVisible();
                    input.onchange = () => {
                        map.getLayers().forEach(l => {
                            if (l.get('type') === 'base') {
                                l.setVisible(l.get('title') === title);
                            }
                        });
                    };
                } else if (layer.get('title') === '📸 Imagem de Drone') {
                    // Adiciona o Image Layer (Drone) ao controle como checkbox
                    input.type = 'checkbox';
                    input.checked = layer.getVisible();
                    input.onchange = () => layer.setVisible(input.checked);
                } else {
                    return; 
                }

                label.appendChild(input);
                label.appendChild(document.createTextNode(' ' + title));
                containerDiv.appendChild(label);
                layerContentContainer.appendChild(containerDiv);
            });

            /* ================= Camadas GeoData (OpenLayers) ================= */
            
            // ATUALIZADO: Adicionado 'propertyKeys' para otimizar a busca
            const camadas = {
                rodovia: { nome: "Rodovias", cor: "#FF4500", layer: null, source: null, visible: false, propertyKeys: new Set() },
                predios_publicos_PMG: { nome: "Prédios Públicos", tipo: "ponto", cor: "#000080", layer: null, source: null, visible: false, propertyKeys: new Set() },
                ruas_nomeadas: { nome: "Ruas", cor: "#A52A2A", layer: null, source: null, visible: false, propertyKeys: new Set() },
                corpos_hidricos_gr: { nome: "Corpos Hídricos", cor: "#4682B4", layer: null, source: null, visible: false, propertyKeys: new Set() },
                lotes_rib: { nome: "Lotes Ribeirão", cor: "#D2B48C", layer: null, source: null, visible: false, propertyKeys: new Set() },
                QUADRAS_GR: { nome: "Quadras", cor: "#BDB76B", layer: null, source: null, visible: true, propertyKeys: new Set() },
                bairros_gurinhem: { nome: "Bairros", cor: "#8A2BE2", layer: null, source: null, visible: false, propertyKeys: new Set() },
                ZONA_URBANA: { nome: "Zona Urbana", cor: "#8FBC8F", layer: null, source: null, visible: false, propertyKeys: new Set() },
                zona_de_expansao: { nome: "Zona de Expansao", tipo:"linha", cor: "#DAA520", layer: null, source: null, visible: false, propertyKeys: new Set() },
                ac_geo: { nome: "construções", cor: "#000000", layer: null, source: null, visible: false, propertyKeys: new Set() } ,
                lotes_gurinhem_ctm: { nome: "Lotes", cor: "#0000FF", layer: null, source: null, visible: false, propertyKeys: new Set() } 
            };

            let selectedFeature = null;
            let selectedFeatureId = null;
            const featureIndex = {};
            let drawInteraction;
            let modifyInteraction;

            // Variáveis de Medição
            let measureDraw, measureSource, measureLayer, helpTooltipElement, helpTooltip, measureTooltipElement, measureTooltip;

            const jstsOlParser = new jsts.io.OL3Parser();

            // --- Estilos OpenLayers ---
            function getPolygonStyle(color, weight = 1, opacity = 0.5, text = '') {
                let fillColorArray;
                try {
                    fillColorArray = ol.color.fromString(String(color) || '#333333'); 
                } catch (e) {
                    console.error(`Erro ao converter cor de polígono: ${color}. Usando cinza padrão.`, e);
                    fillColorArray = ol.color.fromString('#AAAAAA'); 
                }
                
                fillColorArray[3] = opacity;
                
                return new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: '#000000', width: weight }),
                    fill: new ol.style.Fill({ color: fillColorArray }),
                    text: text ? getTextStyle(text) : undefined
                });
            }

            function getLineStyle(color, weight = 2) {
                let strokeColor;
                try {
                    strokeColor = String(color) || '#333333';
                } catch (e) {
                    console.error(`Erro ao converter cor de linha: ${color}. Usando preto padrão.`);
                    strokeColor = '#000000'; 
                }
                
                return new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: strokeColor, width: weight }),
                });
            }

            function getPointStyle(color, radius = 6, text = '') {
                let pointColor;
                try {
                    pointColor = String(color) || '#333333';
                } catch (e) {
                    console.error(`Erro ao converter cor de ponto: ${color}. Usando azul padrão.`);
                    pointColor = '#0000FF'; 
                }

                return new ol.style.Style({
                    image: new ol.style.Circle({
                        fill: new ol.style.Fill({ color: pointColor }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 1 }),
                        radius: radius
                    }),
                    text: text ? getTextStyle(text) : undefined
                });
            }

            function getTextStyle(text) {
                return new ol.style.Text({
                    font: 'bold 12px "Poppins", "Open Sans", "Arial Unicode MS", "sans-serif"',
                    fill: new ol.style.Fill({ color: '#000' }),
                    stroke: new ol.style.Stroke({ color: '#fff', width: 3 }),
                    text: text,
                    overflow: true
                });
            }

            /**
             * Formata uma chave de propriedade para exibição (ex: 'nome_rua' -> 'Nome Rua')
             */
            function formatPropertyKey(key) {
                if (!key) return '';
                // Substitui underscores por espaços e capitaliza a primeira letra de cada palavra
                return key.replace(/_/g, ' ')
                          .replace(/\b\w/g, char => char.toUpperCase());
            }

            // ####################################################################
            // # NOVA FUNÇÃO: Formata o VALOR da propriedade para exibição
            // ####################################################################
            /**
             * Formata um valor de propriedade para exibição.
             * Tenta formatar números (especialmente chaves com 'area') com 3 casas decimais.
             */
            function formatPropertyValue(key, value) {
                if (value === null || value === undefined) {
                    return '---';
                }
                
                const sValue = String(value);
                const lowerKey = key.toLowerCase();

                // Verifica se a chave contem 'area' (ex: Area Const, Area Lote, area_lote, etc.)
                if (lowerKey.includes('area') || lowerKey.includes('área')) {
                    const numValue = parseFloat(sValue);
                    if (!isNaN(numValue)) {
                        // Formata com 3 casas decimais
                        return numValue.toFixed(3);
                    }
                }

                // Para outros valores, apenas retorna como string
                return sValue.replace(/"/g, '&quot;');
            }


            async function carregarCamada(key) {
                const cfg = camadas[key];
                if (cfg.layer) return; 

                const ref = db.collection("GeoData").doc(key).collection("features");
                const snap = await ref.get();

                const features = [];
                snap.forEach(doc => {
                    const dados = doc.data();
                    const docId = doc.id;

                    // 1. ANÁLISE DO JSON e construção do OBJETO FEATURE COMPLETO
                    let geometryObject;
                    try {
                        // O dado.geometry é uma STRING GeoJSON, precisamos dar o parse.
                        geometryObject = JSON.parse(dados.geometry);
                    } catch (e) {
                        console.error(`[ERRO JSON] Camada ${key}, ID ${docId}: Geometria inválida/mal formatada.`, e);
                        return;
                    }

                    // OpenLayers espera um objeto GeoJSON tipo "Feature", não apenas a geometria.
                    const geojsonFeature = {
                        type: "Feature",
                        geometry: geometryObject,
                        properties: dados.properties || {}
                    };

                    const format = new ol.format.GeoJSON();
                    const feature = format.readFeature(geojsonFeature, {
                        dataProjection: 'EPSG:4326',
                        featureProjection: 'EPSG:3857'
                    });
                    
                    // 2. VERIFICAÇÃO DE SEGURANÇA (evita o erro 'reading type')
                    if (!feature || !feature.getGeometry()) {
                        console.warn(`[IGNORADO] Camada ${key}, ID ${docId}: Feature ou Geometria nula/inválida após conversão. Pulando.`);
                        return;
                    }

                    feature.setId(docId);
                    feature.setProperties(geojsonFeature.properties); 

                    // Cria um índice de feições para a busca e popup
                    const props = geojsonFeature.properties;
                    const cleanProps = {};
                    for (const pKey in props) {
                        if (pKey !== 'geometry' && pKey !== 'id' && pKey !== 'bbox' && pKey !== 'style') {
                            cleanProps[pKey] = props[pKey];
                            // ATUALIZADO: Adiciona a chave ao Set de propriedades da camada
                            cfg.propertyKeys.add(pKey);
                        }
                    }
                    featureIndex[docId] = { feature: feature, camada: key, props: cleanProps };

                    let featureStyle;
                    const labelField = props.nome || props.name || props.NOME || props.NM_BAIRRO;
                    const geometryType = feature.getGeometry().getType();

                    if (key === 'bairros_gurinhem') {
                        featureStyle = new ol.style.Style({
                            stroke: new ol.style.Stroke({ color: cfg.cor, width: 2.5 }),
                            fill: new ol.style.Fill({ color: 'rgba(0, 0, 0, 0)' }), 
                            text: getTextStyle(labelField || '') 
                        });
                    } else if (key === 'predios_publicos_PMG' || geometryType === 'Point') {
                        featureStyle = getPointStyle(cfg.cor, 7, labelField || '');
                    } else if (geometryType === 'LineString' || geometryType === 'MultiLineString') {
                        featureStyle = getLineStyle(cfg.cor, key === 'rodovia' ? 3 : 2);
                    } else {
                        let labelText = '';
                        if (props.inscricao_imobiliaria) { 
                            labelText = props.inscricao_imobiliaria;
                        } else if (props.ordem !== undefined && props.ordem !== null) {
                            labelText = String(props.ordem);
                        }
                        featureStyle = getPolygonStyle(cfg.cor, undefined, 0.5, labelText);
                    }
                    
                    feature.setStyle(featureStyle);
                    features.push(feature);
                });

                cfg.source = new ol.source.Vector({ features: features });
                cfg.layer = new ol.layer.Vector({
                    title: cfg.nome,
                    source: cfg.source,
                    renderBuffer: 200,
                    visible: cfg.visible 
                });

                map.addLayer(cfg.layer);

                // ADIÇÃO DO BOTÃO DE ZOOM NA CAMADA
                const containerDiv = document.createElement('div');
                containerDiv.className = 'layer-control-item';
                
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = cfg.visible; 
                checkbox.onchange = () => cfg.layer.setVisible(checkbox.checked);
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(' ' + cfg.nome));
                
                const zoomButton = document.createElement('button');
                zoomButton.className = 'zoom-btn';
                zoomButton.innerHTML = '🔍'; 
                zoomButton.title = `Aproximar para a camada ${cfg.nome}`;
                zoomButton.onclick = () => window.zoomToLayer(key);

                containerDiv.appendChild(label);
                containerDiv.appendChild(zoomButton);
                layerContentContainer.appendChild(containerDiv);
            }

            // Inicia o carregamento de todas as camadas
            Object.keys(camadas).forEach(carregarCamada);

            // FUNÇÃO DE ZOOM NA CAMADA (Aproximar para a extensão da camada)
            mapFunctions.zoomToLayer = function(camadaKey) {
                const camada = camadas[camadaKey];
                if (!camada.layer || !camada.source || camada.source.getFeatures().length === 0) {
                    Swal.fire('Aviso', `A camada "${camada.nome}" está vazia ou não carregou completamente.`, 'info');
                    return;
                }

                const extent = camada.source.getExtent();
                
                if (ol.extent.isEmpty(extent)) {
                    Swal.fire('Aviso', `A camada "${camada.nome}" está vazia ou não contém geometrias.`, 'info');
                    return;
                }
                
                map.getView().fit(extent, {
                    size: map.getSize(),
                    padding: [50, 50, 50, 50],
                    duration: 1500,
                    maxZoom: 20
                });
            };


            const select = new ol.interaction.Select({
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: '#f00', width: 3 }),
                    fill: new ol.style.Fill({ color: 'rgba(255,0,0,0.2)' }),
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({ color: '#f00' }),
                        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                    })
                }),
                layers: (layer) => Object.values(camadas).some(cfg => cfg.layer === layer)
            });
            map.addInteraction(select);

            select.on('select', (event) => {
                selectedFeature = event.selected.length > 0 ? event.selected[0] : null;
                selectedFeatureId = selectedFeature ? selectedFeature.getId() : null;
            });

            let currentSearchHighlightFeature = null;


            // ====================================================================
            // ATUALIZADO: LÓGICA DO POPUP (map.on('click'))
            // ====================================================================
            map.on('click', async (event) => {
                // Impede que o popup feche se o clique for dentro dele
                const clickedElement = document.getElementById('map-popup');
                if (clickedElement && clickedElement.contains(event.originalEvent.target)) {
                    return;
                }

                // Não mostra popup para a feição que já está destacada pela busca
                const feature = map.forEachFeatureAtPixel(event.pixel, (feature, layer) => {
                    if (feature === currentSearchHighlightFeature) return null;
                    return feature;
                });

                if (feature) {
                    const featureId = feature.getId();
                    const camadaKey = Object.keys(camadas).find(key => camadas[key].layer && camadas[key].layer.getSource().getFeatureById(featureId));
                    if (!camadaKey) {
                        overlay.setPosition(undefined);
                        return;
                    }

                    const featureProps = featureIndex[featureId]?.props || {};
                    
                    // REFEITO: Gera HTML limpo e padronizado, sem formulário ou edição
                    let popupHtml = '<div class="popup-info-grid">'; 
                    
                    // Ordena as chaves alfabeticamente para consistência
                    const sortedKeys = Object.keys(featureProps).sort();

                    for (const key of sortedKeys) {
                        // ####################################################################
                        // # ATUALIZADO: Usa as novas funções de formatação
                        // ####################################################################
                        const rawValue = featureProps[key];
                        const displayKey = formatPropertyKey(key); 
                        const displayValue = formatPropertyValue(key, rawValue); // Formata o valor
                        
                        popupHtml += `
                            <div class="info-key">${displayKey}:</div>
                            <div class="info-value">${displayValue}</div>
                        `;
                    }

                    popupHtml += '</div>'; // Fecha o .popup-info-grid

                    document.getElementById('popup-title').innerText = `Informações: ${camadas[camadaKey].nome}`;

                    if (typeof content !== 'undefined') {
                        content.innerHTML = popupHtml;
                        overlay.setPosition(event.coordinate);
                    } else {
                        console.error("Variável 'content' não encontrada.");
                    }

                } else {
                    if (typeof overlay !== 'undefined') {
                        overlay.setPosition(undefined);
                    }
                }
            });


            /* ==================== Medição de Distância e Área ==================== */
            mapFunctions.addInteraction = function(type) {
                mapFunctions.clearMeasurements(true); 

                measureSource = new ol.source.Vector();
                measureLayer = new ol.layer.Vector({
                    source: measureSource,
                    style: new ol.style.Style({
                        fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.2)' }),
                        stroke: new ol.style.Stroke({ color: '#ffcc33', width: 3 }),
                        image: new ol.style.Circle({
                            radius: 7,
                            fill: new ol.style.Fill({ color: '#ffcc33' })
                        })
                    })
                });
                map.addLayer(measureLayer);

                measureDraw = new ol.interaction.Draw({
                    source: measureSource,
                    type: type,
                    style: new ol.style.Style({
                        fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.2)' }),
                        stroke: new ol.style.Stroke({ color: 'rgba(0, 0, 0, 0.5)', lineDash: [10, 10], width: 2 }),
                        image: new ol.style.Circle({
                            radius: 5,
                            stroke: new ol.style.Stroke({ color: 'rgba(0, 0, 0, 0.7)' }),
                            fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.2)' })
                        })
                    })
                });
                map.addInteraction(measureDraw);

                createMeasureTooltip();
                createHelpTooltip();
                map.on('pointermove', mapFunctions.pointerMoveHandler);

                let listener;
                measureDraw.on('drawstart', function(evt) {
                    let sketch = evt.feature;
                    measureTooltipElement.innerHTML = '';
                    
                    listener = sketch.getGeometry().on('change', function(evt) {
                        let geom = evt.target;
                        let output;
                        if (geom instanceof ol.geom.Polygon) {
                            output = mapFunctions.formatArea(geom);
                        } else if (geom instanceof ol.geom.LineString) {
                            output = mapFunctions.formatLength(geom);
                        }
                        measureTooltipElement.innerHTML = output;
                        measureTooltip.setPosition(geom.getLastCoordinate());
                    });
                });

                measureDraw.on('drawend', function(evt) {
                    measureTooltipElement.className = 'ol-tooltip ol-tooltip-static';
                    measureTooltip.setOffset([0, -7]);
                    ol.Observable.unByKey(listener);
                    
                    // Limpa o tooltip de ajuda
                    map.un('pointermove', mapFunctions.pointerMoveHandler);
                    if (helpTooltipElement) {
                        helpTooltipElement.parentElement.removeChild(helpTooltipElement);
                        helpTooltipElement = null;
                    }
                    if (helpTooltip) map.removeOverlay(helpTooltip);
                    
                    map.removeInteraction(measureDraw);
                    measureDraw = null;
                });
            };

            function createHelpTooltip() {
                if (helpTooltipElement) {
                    helpTooltipElement.parentElement.removeChild(helpTooltipElement);
                }
                helpTooltipElement = document.createElement('div');
                helpTooltipElement.className = 'ol-tooltip';
                helpTooltip = new ol.Overlay({
                    element: helpTooltipElement,
                    offset: [15, 0],
                    positioning: 'center-left'
                });
                map.addOverlay(helpTooltip);
            }

            function createMeasureTooltip() {
                if (measureTooltipElement) {
                   measureTooltipElement.parentElement.removeChild(measureTooltipElement);
                }
                measureTooltipElement = document.createElement('div');
                measureTooltipElement.className = 'ol-tooltip ol-tooltip-measure';
                measureTooltip = new ol.Overlay({
                    element: measureTooltipElement,
                    offset: [0, -15],
                    positioning: 'bottom-center'
                });
                map.addOverlay(measureTooltip);
            }
            
            mapFunctions.pointerMoveHandler = function(evt) {
                if (evt.dragging) {
                    return;
                }
                let helpMsg = 'Clique para iniciar a medição';
                
                if (measureDraw && measureDraw.sketch) {
                    const geom = measureDraw.sketch.getGeometry();
                    if (geom instanceof ol.geom.Polygon) {
                        helpMsg = 'Continue clicando para desenhar o polígono (Clique duplo para finalizar)';
                    } else if (geom instanceof ol.geom.LineString) {
                        helpMsg = 'Continue clicando para desenhar a linha (Clique duplo para finalizar)';
                    }
                }
                
                if(helpTooltipElement) {
                    helpTooltipElement.innerHTML = helpMsg;
                    helpTooltip.setPosition(evt.coordinate);
                    helpTooltipElement.classList.remove('hidden');
                }
            };

            mapFunctions.formatLength = (line) => {
                const length = ol.sphere.getLength(line);
                return `${length.toFixed(2)} m`; 
            };

            // ATUALIZADO: Medição de área da FERRAMENTA com 3 casas decimais
            mapFunctions.formatArea = (polygon) => {
                const area = ol.sphere.getArea(polygon);
                return `${area.toFixed(3)} m²`; 
            };
            
            mapFunctions.toggleMeasureDistance = () => {
                if (!measureDraw || measureDraw.type_ !== 'LineString') {
                    mapFunctions.addInteraction('LineString');
                } else {
                    mapFunctions.clearMeasurements();
                }
            };
            mapFunctions.toggleMeasureArea = () => {
                if (!measureDraw || measureDraw.type_ !== 'Polygon') {
                    mapFunctions.addInteraction('Polygon');
                } else {
                    mapFunctions.clearMeasurements();
                }
            };

            mapFunctions.clearMeasurements = function() {
                if (measureDraw) {
                    map.removeInteraction(measureDraw);
                    measureDraw = null;
                }
                if (measureLayer) {
                    map.removeLayer(measureLayer);
                    measureLayer = null;
                }
                if (helpTooltip) map.removeOverlay(helpTooltip);
                if (measureTooltip) map.removeOverlay(measureTooltip);
                
                const staticTooltips = document.querySelectorAll('.ol-tooltip-static');
                staticTooltips.forEach(tip => tip.remove());
                
                map.un('pointermove', mapFunctions.pointerMoveHandler);
            };

            /* ==================== Funcionalidades de Impressão ==================== */
            mapFunctions.activatePrintMode = function() {
                document.body.classList.add('print-mode-active');
                printModeControls.style.display = 'flex';
                northArrowPrint.style.display = 'block';
            };

            mapFunctions.deactivatePrintMode = function() {
                document.body.classList.remove('print-mode-active');
                printModeControls.style.display = 'none';
                northArrowPrint.style.display = 'none';
            };

            mapFunctions.triggerPrint = () => window.print();

            /* ==================== Funcionalidades de Exportação (KML) ==================== */
            mapFunctions.mostrarOpcoesExportacao = async function() {
                const inputOptions = Object.keys(camadas).reduce((acc, key) => {
                    acc[key] = camadas[key].nome;
                    return acc;
                }, {});

                const { value: camadaKey } = await Swal.fire({
                    title: 'Exportar Camada para KML',
                    input: 'select',
                    inputOptions: inputOptions,
                    inputPlaceholder: 'Selecione a camada',
                    showCancelButton: true,
                    confirmButtonText: 'Exportar',
                    cancelButtonText: 'Cancelar',
                    inputValidator: (value) => {
                        if (!value) {
                            return 'Você precisa selecionar uma camada!';
                        }
                    }
                });
                if (camadaKey) {
                    mapFunctions.exportLayerToKML(camadaKey);
                }
            };

            mapFunctions.exportLayerToKML = function(camadaKey) {
                const camada = camadas[camadaKey];
                if (!camada.layer || camada.source.getFeatures().length === 0) {
                    Swal.fire('Erro', `A camada "${camada.nome}" está vazia ou não foi carregada.`, 'error');
                    return;
                }

                const kmlFormat = new ol.format.KML({
                    extractStyles: true,
                    writeStyles: true,
                    showPointNames: true
                });

                const kmlString = kmlFormat.writeFeatures(camada.source.getFeatures(), {
                    dataProjection: 'EPSG:4326',
                    featureProjection: map.getView().getProjection()
                });

                const blob = new Blob([kmlString], { type: 'application/vnd.google-earth.kml+xml;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${camada.nome.replace(/\s+/g, '_')}.kml`;
                link.click();
                URL.revokeObjectURL(link.href);
                Swal.fire('Sucesso!', `A camada "${camada.nome}" foi exportada para KML.`, 'success');
            };

            /* ==================== Funcionalidade de Busca de Feições ==================== */
            const camadaSelect = document.getElementById('camadaSelect');
            const campoSelect = document.getElementById('campoSelect');
            const valorBuscaInput = document.getElementById('valorBusca');
            const sugestoesDiv = document.getElementById('sugestoes');
            let originalFeatureStyle = null;

            // Popula o select de camadas
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "Selecione uma camada...";
            camadaSelect.appendChild(defaultOption);

            Object.keys(camadas).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = camadas[key].nome;
                camadaSelect.appendChild(option);
            });

            camadaSelect.addEventListener('change', () => {
                mapFunctions.populateCampoSelect(camadaSelect.value);
                valorBuscaInput.value = '';
                sugestoesDiv.innerHTML = '';
                sugestoesDiv.style.display = 'none';
            });


            // ATUALIZADO: Popula o select de campos usando os 'propertyKeys' otimizados
            mapFunctions.populateCampoSelect = function(camadaKey) {
                campoSelect.innerHTML = '<option value="">Selecione um campo...</option>';
                if (!camadaKey) return;

                const camadaData = camadas[camadaKey];
                if (camadaData && camadaData.propertyKeys) {
                    // Ordena as chaves para exibição consistente
                    const sortedKeys = Array.from(camadaData.propertyKeys).sort();
                    
                    sortedKeys.forEach(key => {
                        const option = document.createElement('option');
                        option.value = key;
                        // Usa a função de formatação para um nome amigável
                        option.textContent = formatPropertyKey(key); 
                        campoSelect.appendChild(option);
                    });
                }
            };

            // Lógica de sugestão (autocomplete)
            valorBuscaInput.addEventListener('input', () => {
                const query = valorBuscaInput.value.toLowerCase().trim();
                const camadaKey = camadaSelect.value;
                const campoKey = campoSelect.value;
                sugestoesDiv.innerHTML = '';

                if (query.length < 2 || !camadaKey || !campoKey) {
                    sugestoesDiv.style.display = 'none';
                    return;
                }

                const camadaData = camadas[camadaKey];
                if (camadaData && camadaData.source) {
                    const suggestions = new Set();
                    const features = camadaData.source.getFeatures();
                    
                    // Limita o número de features a verificar para performance
                    const maxFeaturesToCheck = 500; 
                    
                    for(let i = 0; i < features.length && suggestions.size < 10; i++) {
                        const feature = features[i];
                        const value = feature.get(campoKey);
                        if (value && String(value).toLowerCase().includes(query)) {
                            suggestions.add(String(value));
                        }
                    }

                    if (suggestions.size > 0) {
                        suggestions.forEach(sugestao => {
                            const item = document.createElement('div');
                            item.className = 'sugestao-item';
                            item.textContent = sugestao;
                            item.onclick = () => {
                                valorBuscaInput.value = sugestao;
                                sugestoesDiv.style.display = 'none';
                                mapFunctions.buscarFeicao();
                            };
                            sugestoesDiv.appendChild(item);
                        });
                        sugestoesDiv.style.display = 'block';
                    } else {
                        sugestoesDiv.style.display = 'none';
                    }
                }
            });

            // Fecha as sugestões se clicar fora
            document.addEventListener('click', (event) => {
                if (!sugestoesDiv.contains(event.target) && event.target !== valorBuscaInput) {
                    sugestoesDiv.style.display = 'none';
                }
            });

            
            // ATUALIZADO: Lógica de busca de feição
            mapFunctions.buscarFeicao = async function() {
                mapFunctions.clearSearchHighlight();
                const camadaKey = camadaSelect.value;
                const campoKey = campoSelect.value;
                const valorBusca = valorBuscaInput.value;

                if (!camadaKey || !campoKey || !valorBusca) {
                    Swal.fire('Aviso', 'Por favor, selecione camada, campo e digite um valor para a busca.', 'warning');
                    return;
                }

                const camadaData = camadas[camadaKey];
                
                // Usa .filter() para encontrar TODAS as correspondências
                const foundFeatures = camadaData?.source?.getFeatures().filter(
                    f => String(f.get(campoKey)).toLowerCase() === String(valorBusca).toLowerCase()
                );

                if (foundFeatures && foundFeatures.length > 0) {
                    
                    // Pega a primeira feição para destacar
                    const featureToHighlight = foundFeatures[0]; 
                    
                    currentSearchHighlightFeature = featureToHighlight;
                    originalFeatureStyle = featureToHighlight.getStyle();

                    const highlightStyle = new ol.style.Style({
                        stroke: new ol.style.Stroke({ color: '#FFFF00', width: 5 }),
                        fill: new ol.style.Fill({ color: 'rgba(255, 255, 0, 0.5)' }),
                        image: new ol.style.Circle({
                            radius: 10,
                            fill: new ol.style.Fill({ color: '#FFFF00' }),
                            stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                        }),
                        text: getTextStyle(featureToHighlight.get('nome') || featureToHighlight.get(campoKey) || '') 
                    });
                    
                    featureToHighlight.setStyle(highlightStyle);

                    map.getView().fit(featureToHighlight.getGeometry().getExtent(), {
                        padding: [150, 150, 150, 150],
                        duration: 1200,
                        maxZoom: 20
                    });

                    // Informa se mais de uma feição foi encontrada
                    let title = 'Feição encontrada!';
                    if (foundFeatures.length > 1) {
                        title = `${foundFeatures.length} feições encontradas! Destacando a primeira.`;
                    }

                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'success',
                        title: title,
                        showConfirmButton: false,
                        timer: 3500
                    });

                } else {
                    Swal.fire('Não Encontrado', 'Nenhuma feição corresponde aos critérios de busca.', 'info');
                }
            };

            mapFunctions.clearSearchHighlight = function() {
                if (currentSearchHighlightFeature) {
                    currentSearchHighlightFeature.setStyle(originalFeatureStyle);
                    currentSearchHighlightFeature = null;
                    originalFeatureStyle = null;
                }
            };

            function getRandomColor() { return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'); }

        } // Fim da função initializeMapAndLayers
    </script>
</body>
</html>
